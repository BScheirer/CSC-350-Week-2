<svg xmlns="http://www.w3.org/2000/svg" width="780" height="980" viewBox="0 0 780 980" role="img" aria-labelledby="arttitle artdesc">
  <title id="arttitle">Vintage microphone and vinyl record</title>
  <desc id="artdesc">A gold vintage microphone in front of a large vinyl record, abstract light rays, and stars on a warm rust background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bb6d45"/><stop offset=".55" stop-color="#995332"/><stop offset="1" stop-color="#482b25"/></linearGradient>
